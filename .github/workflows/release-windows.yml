name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so the runner can read the commit message

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        shell: pwsh
        run: |
          @"
          VITE_VERCEL_APPID=${{ secrets.VITE_VERCEL_APPID }}
          VITE_VERCEL_AWS_SECRET_ACCESS_KEY=${{ secrets.VITE_VERCEL_AWS_SECRET_ACCESS_KEY }}
          VITE_VERCEL_APIKEY=${{ secrets.VITE_VERCEL_APIKEY }}
          VITE_VERCEL_AUTHDOMAIN=${{ secrets.VITE_VERCEL_AUTHDOMAIN }}
          VITE_VERCEL_PROJECTID=${{ secrets.VITE_VERCEL_PROJECTID }}
          VITE_VERCEL_STORAGEBUCKET=${{ secrets.VITE_VERCEL_STORAGEBUCKET }}
          VITE_VERCEL_MESSAGINGSENDERID=${{ secrets.VITE_VERCEL_MESSAGINGSENDERID }}
          VITE_VERCEL_MEASUREMENTID=${{ secrets.VITE_VERCEL_MEASUREMENTID }}
          VITE_VERCEL_AWS_BUCKET_REGION=${{ secrets.VITE_VERCEL_AWS_BUCKET_REGION }}
          VITE_VERCEL_AWS_ACCESS_KEY_ID=${{ secrets.VITE_VERCEL_AWS_ACCESS_KEY_ID }}
          VITE_VERCEL_AWS_BUCKET_ID=${{ secrets.VITE_VERCEL_AWS_BUCKET_ID }}
          VITE_VERCEL_DEVMODE_KEY=${{ secrets.VITE_VERCEL_DEVMODE_KEY }}
          "@ | Out-File -FilePath .env.production -Encoding utf8

      - name: Compile source code
        run: npm run build

      - name: Fetch latest commit message
        id: get_commit
        shell: pwsh
        run: |
          # Retrieve the subject line of the latest commit
          $msg = git log -1 --pretty=%s
          echo "RELEASE_NOTES=$msg" >> $env:GITHUB_ENV

      - name: Build and publish Windows app
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
